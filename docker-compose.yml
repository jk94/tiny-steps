# Single-container self-hosted deployment (see README + CLAUDE.md for why
# there is only one service: NestJS serves the built SPA itself).
#
# Usage:
#   cp config.example.yml config.yml   # adjust as needed
#   docker compose up --build
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: baby-tracker:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Path to the mounted config file (see below). `config.yml` does NOT
      # control the database connection string (see `config.example.yml`) —
      # DATABASE_URL below is the sole source of truth for that. It's set
      # explicitly here (rather than relying on the code-level default of
      # `file:./data/dev.db`, see `src/config/database-url.ts`) because it
      # must point at the `sqlite_data` volume mount, not the container's
      # working directory. `docker-entrypoint.sh` runs `prisma migrate
      # deploy` against this URL before the app starts.
      CONFIG_PATH: /app/config.yml
      DATABASE_URL: 'file:/app/data/dev.db'
      # Directory for uploaded files (currently only child photos, see
      # apps/backend/src/config/uploads-dir.ts) — must point inside the
      # `sqlite_data` volume mount, same reasoning as DATABASE_URL above,
      # not the code-level default of `./data/uploads`.
      UPLOADS_DIR: /app/data/uploads
      # No default (unlike DATABASE_URL) — see apps/backend/src/config/jwt.config.ts
      # and .env.example. Docker Compose auto-loads a root .env file.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Public base URL this deployment is reachable at (e.g. behind your
      # reverse proxy's domain) — used to build the OIDC redirect_uri, which
      # must byte-exact-match what's registered at each configured IdP. See
      # apps/backend/src/config/public-url.ts and
      # docs/adr/0004-oidc-authentication.md. Falls back to
      # http://localhost:3000 if unset, which only works for local testing.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    volumes:
      # Real config with secrets — copy from config.example.yml, never
      # committed (see .gitignore). Read-only in the container.
      - ./config.yml:/app/config.yml:ro
      # Persists both the SQLite database and uploaded child photos across
      # `docker compose down`/`up`.
      - sqlite_data:/app/data

volumes:
  sqlite_data:
