# Example configuration for the Baby Tracking App backend.
#
# Copy this file to `config.yml` (git-ignored) and adjust the values for
# your deployment. The backend reads its config path from the `CONFIG_PATH`
# env var (default: `./config.yml`), loads this YAML file, and validates it
# at startup — invalid config makes the app refuse to boot (fail-fast).

server:
  port: 3000

database:
  # sqlite | postgresql | mysql
  #
  # IMPORTANT: this is a sanity-check value only, not a runtime switch. It
  # must match the static `datasource.provider` string that
  # `apps/backend/prisma/schema.prisma` was actually generated for. The
  # backend fails fast at startup if the two disagree. Changing this value
  # alone does NOT make the app talk to a different kind of database —
  # switching providers is an explicit one-time process: edit
  # `schema.prisma`'s `provider`, swap the matching Prisma driver adapter in
  # `PrismaService`, run `prisma generate`, then apply a fresh
  # `prisma migrate deploy` against the new database.
  #
  # NOTE: there is deliberately no `url` field here. The database connection
  # string is controlled solely via the `DATABASE_URL` environment variable
  # (see `docker-compose.yml`), with a working default of
  # `file:./data/dev.db` if it's unset — editing this file does NOT change
  # which database the app connects to.
  provider: sqlite

auth:
  local:
    enabled: true
  oidc:
    # NOTE: an OIDC login whose email claim matches an existing local (or
    # other-provider) account is auto-linked to that account, unconditionally
    # — no email_verified check. Only configure providers you trust to own
    # the emails they assert. See docs/adr/0004-oidc-authentication.md.
    providers: []
    # Example provider entry (uncomment/adapt for a real deployment). This
    # file is git-ignored and operator-managed once copied to `config.yml`
    # (see the root README) — treat it as a secrets file, same as
    # `clientSecret` below being stored here instead of an env var.
    # providers:
    #   - id: keycloak
    #     displayName: "Keycloak"
    #     issuer: "https://keycloak.example.com/realms/family"
    #     clientId: "baby-tracker"
    #     clientSecret: "REPLACE_ME"
    #     scopes: ["openid", "profile", "email"]

# Push notifications (OPTIONAL). Omit this whole section to run without push —
# the app then simply never sends notifications (PushSenderService no-ops).
#
# Native mobile push unavoidably relies on cloud relays (Google FCM, and APNs
# for iOS via FCM), which is a deliberate, explicit exception to the
# "self-hosted only" principle — see docs/adr/0012-capacitor-native-wrapper.md.
# Each operator supplies THEIR OWN Firebase project credential; there is no
# shared/central push service run by this project.
#
# `serviceAccountPath` points at a Firebase service-account JSON file you
# download from your own Firebase project (Project settings → Service
# accounts → Generate new private key). Treat it as a secret; keep it out of
# version control (config.yml is git-ignored).
# push:
#   firebase:
#     serviceAccountPath: "./firebase-service-account.json"

# Alexa skill (OPTIONAL, Phase 8). Omit this whole section to keep the Alexa
# integration off — every /api/alexa/** route then answers 404. Each instance
# runs its own private skill; see alexa/README.md for the full setup and
# docs/adr/0017-alexa-skill-account-linking-and-in-process-endpoint.md for the
# design. Treat clientSecret like the OIDC secrets above (this file is
# git-ignored once copied to config.yml).
# alexa:
#   # Skill ID from the Alexa developer console.
#   skillId: "amzn1.ask.skill.00000000-0000-0000-0000-000000000000"
#   # Must match "Your Client ID"/"Your Secret" under the skill's Account Linking.
#   clientId: "tinysteps-alexa"
#   clientSecret: "REPLACE_ME_with_at_least_32_random_characters"
#   # The "Alexa Redirect URLs" shown under Account Linking, exactly as listed.
#   redirectUris:
#     - "https://pitangui.amazon.com/api/skill/link/MXXXXXXXXXXXXX"
#     - "https://layla.amazon.com/api/skill/link/MXXXXXXXXXXXXX"
#     - "https://alexa.amazon.co.jp/api/skill/link/MXXXXXXXXXXXXX"
#   # Optional per-language overrides of what Alexa says. Keys/placeholders:
#   # apps/backend/src/alexa/skill/alexa-messages.ts — unknown ones fail startup.
#   responses:
#     de:
#       goodbye: "Tschüss!"
