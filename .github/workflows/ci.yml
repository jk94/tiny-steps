name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep the Bun version pinned in sync with the Dockerfile's build stage.
  BUN_VERSION: 1.3.14

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint, both apps)
        run: bun run lint

      - name: Format check (Prettier, both apps)
        run: bun run format:check

  backend:
    name: Backend (test & build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run --cwd apps/backend prisma:generate

      # Unit tests only (src/**/*.spec.ts, fully mocked) — test:e2e needs a
      # real database and is intentionally out of scope for this pipeline.
      - name: Unit tests
        run: bun run --cwd apps/backend test

      - name: Build
        run: bun run --cwd apps/backend build

  frontend:
    name: Frontend (test & build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run --cwd apps/frontend test

      - name: Build
        run: bun run --cwd apps/frontend build

  docker:
    name: Docker build (& push on main)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Don't spend time building an image if lint/tests/build already failed.
    needs: [lint, backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build image (validation only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

      # TODO: placeholder registry (GHCR) — adjust once final image
      # hosting/registry is decided. Only runs on a push to main.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
